[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dictllm"
version = "0.1.0.dev0"
description = "Minimal LLaMA shared-dictionary compression with zero-preserving NVFP4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "transformers>=4.45.1,<6", "accelerate>=0.30",
  "datasets>=2.19", "numpy>=1.24", "pyyaml>=6.0", "safetensors>=0.4",
  "tqdm>=4.66", "sentencepiece>=0.2", "protobuf>=3.20",
]

[project.optional-dependencies]
test = ["pytest>=8"]
eval = ["lm-eval>=0.4.9,<0.5"]

[project.scripts]
dictllm = "dictllm.cli:main"
dictllm-nvfp4 = "dictllm.nvfp4.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
